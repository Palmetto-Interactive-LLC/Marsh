name: "Attestations PUBLIC-REPO-ONLY"

# PUBLIC-REPO-ONLY: artifact attestations are useful for published public
# artifacts. Do not make this a required check for private template repositories.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  attest-public-repo-only:
    name: "Attestations PUBLIC-REPO-ONLY"
    if: github.event.repository.private == false
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format tar.gz --output dist/source.tar.gz HEAD

      - name: Attest source artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/source.tar.gz

      - name: Upload attested artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-source
          path: dist/source.tar.gz
          if-no-files-found: error
