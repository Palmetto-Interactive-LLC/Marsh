name: Security

# Secrets, dependency and workflow linting run in pi-checks. This workflow keeps the
# extra static analysis (Semgrep, Trivy, Checkov) and OpenSSF Scorecard. These run on
# main and weekly, not on every PR, to keep Actions minutes down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECKOV_VERSION: 3.3.2
  SEMGREP_VERSION: 1.168.0
  TRIVY_IMAGE_REF: ${{ vars.TRIVY_IMAGE_REF }}
  TRIVY_VERSION: 0.71.2

jobs:
  sast:
    name: sast
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user "semgrep==${SEMGREP_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p reports

      - name: sast
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/ci \
            --config p/security-audit \
            --metrics=off \
            --error \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude build \
            --sarif \
            --output reports/semgrep.sarif \
            .

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sast
          path: reports/semgrep.sarif
          if-no-files-found: ignore

  iac-scan:
    name: iac-scan
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy and Checkov
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy" "$GITHUB_WORKSPACE/reports"
          artifact="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$artifact" "$base_url/$artifact"
          curl -fsSLo "$RUNNER_TEMP/trivy_checksums.txt" "$base_url/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $artifact$" "$RUNNER_TEMP/trivy_checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$artifact" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
          python3 -m pip install --user "checkov==${CHECKOV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: iac-scan
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs .git \
            --skip-dirs node_modules \
            --format sarif \
            --output reports/trivy-fs.sarif \
            .
          if [ -n "${TRIVY_IMAGE_REF:-}" ]; then
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format sarif \
              --output reports/trivy-image.sarif \
              "$TRIVY_IMAGE_REF"
          fi
          checkov -d . \
            --quiet \
            --compact \
            --skip-path .git \
            --skip-path node_modules \
            --output cli \
            | tee reports/checkov.txt

      - name: Upload IaC scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-iac-scan
          path: |
            reports/trivy-fs.sarif
            reports/trivy-image.sarif
            reports/checkov.txt
          if-no-files-found: ignore

  scorecard:
    name: scorecard
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard without GHAS upload
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: reports/scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scorecard
          path: reports/scorecard.sarif
          if-no-files-found: ignore
