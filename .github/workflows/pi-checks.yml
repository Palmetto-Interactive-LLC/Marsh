name: PI Checks

on:
  pull_request:

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@dc18197051d605b2a0644922f7798acd2349e776 # v1
    with:
      stack: python
      # Marsh's own gate (shell, JSON, TOML, Python and Terraform checks).
      install-command: python -m pip install --requirement orchestrator/requirements.txt
      lint-command: make verify
      typecheck-command: "-"
      test-command: "-"
      build-command: "-"
