name: PI Checks

on:
  pull_request:

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@9d1ad406a62908ebf904a18613371ea669e04d33 # v1
    with:
      stack: python
      # Marsh's own gate (shell, JSON, TOML, Python and Terraform checks).
      install-command: python -m pip install --requirement orchestrator/requirements.txt
      lint-command: make verify
      typecheck-command: "-"
      test-command: "-"
      build-command: "-"
