name: "CodeQL PUBLIC-REPO-ONLY"

# PUBLIC-REPO-ONLY: CodeQL analysis uploads require public repositories or GitHub
# Advanced Security licensing. This workflow is intentionally not a required check
# for private GitHub Team template repositories.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql-public-repo-only:
    name: "CodeQL PUBLIC-REPO-ONLY"
    if: github.event.repository.private == false
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Autobuild
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "No buildable package detected; CodeQL will analyze source directly."
          fi

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
